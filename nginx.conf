# nginx.conf
# -> reverse proxy all-in-one container:
#    - /write, /get_command, /set_light, dll  → API Gateway :5000
#    - semua request lain + WebSocket         → Streamlit :8501
# -> nginx listen di :8080 (port yang di-expose Cloud Run)

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    # Temp paths yang writable di Cloud Run (non-root)
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    access_log /dev/stdout;

    keepalive_timeout 0;  # Tutup koneksi setelah setiap response — cegah urequests hang

    # WebSocket support (dibutuhkan Streamlit)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream streamlit {
        server 127.0.0.1:8501;
    }

    upstream gateway {
        server 127.0.0.1:5000;
    }

    server {
        listen 8080;

        # --- API Gateway endpoints ---
        location ~ ^/(write|get_command|set_light|device_sessions|toggle_security|unblock_ips|security_log|notify_session) {
            proxy_pass         http://gateway;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # --- Streamlit WebSocket (/_stcore/stream) ---
        location /_stcore/stream {
            proxy_pass         http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        # --- Semua request lain → Streamlit ---
        location / {
            proxy_pass         http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
        }
    }
}
